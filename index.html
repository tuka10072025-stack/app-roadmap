<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#111111" />
  <title>APP IDEA BOARD</title><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

  <style>
    :root{
      --bg:#f3f3f3;
      --card:#ffffff;
      --text:#171717;
      --sub:#777;
      --line:#dedede;
      --dark:#111;
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{
      max-width:760px;
      margin:auto;
      padding:18px 14px 100px;
    }
    h1{
      margin:6px 2px 16px;
      font-size:26px;
      letter-spacing:.04em;
    }
    .panel{
      background:var(--card);
      border-radius:var(--radius);
      padding:14px;
      margin-bottom:14px;
      box-shadow:0 2px 12px rgba(0,0,0,.05);
    }
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    @media(max-width:540px){
      .grid{grid-template-columns:1fr}
    }
    input,select,textarea,button{
      width:100%;
      font:inherit;
    }
    input,select,textarea{
      border:1px solid var(--line);
      background:#fff;
      border-radius:12px;
      padding:12px;
      outline:none;
    }
    textarea{
      min-height:82px;
      resize:vertical;
    }
    .label{
      font-size:12px;
      color:var(--sub);
      margin:0 0 5px 3px;
    }
    .field{margin-bottom:10px}
    .add{
      border:0;
      border-radius:13px;
      padding:13px;
      background:var(--dark);
      color:white;
      font-weight:700;
      cursor:pointer;
    }
    .filters{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:10px;
    }
    @media(max-width:540px){.filters{grid-template-columns:1fr}}
    .card{
      background:#fff;
      border-radius:16px;
      padding:14px;
      margin-bottom:10px;
      box-shadow:0 2px 10px rgba(0,0,0,.045);
    }
    .top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }
    .title{
      font-size:18px;
      font-weight:750;
      line-height:1.35;
      word-break:break-word;
    }
    .type{
      display:inline-block;
      margin-top:6px;
      font-size:12px;
      color:#555;
      background:#eee;
      padding:4px 8px;
      border-radius:999px;
    }
    .memo{
      white-space:pre-wrap;
      color:#444;
      margin-top:10px;
      line-height:1.55;
      font-size:14px;
    }
    .row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
      margin-top:12px;
      align-items:center;
    }
    .status{
      border-radius:10px;
      padding:9px 10px;
      border:1px solid var(--line);
      background:#fafafa;
    }
    .del{
      width:auto;
      border:0;
      border-radius:10px;
      padding:10px 12px;
      background:#f0f0f0;
      color:#333;
      cursor:pointer;
    }
    .date{
      margin-top:8px;
      font-size:11px;
      color:#999;
    }
    .empty{
      text-align:center;
      color:#999;
      padding:28px 10px;
    }
    .count{
      font-size:13px;
      color:#777;
      margin:2px 4px 10px;
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>APP IDEA BOARD</h1>

  <div class="panel">
    <div class="grid">
      <div class="field">
        <div class="label">アプリ名</div>
        <select id="appName" onchange="toggleCustomAppName()">
          <option>MIRU</option>
          <option>WAKERU</option>
          <option>KAKOMON</option>
          <option>ひらめきメモ</option>
          <option>知識メモ</option>
          <option>年間予定</option>
          <option>将棋反省</option>
          <option value="__custom__">新規入力</option>
        </select>
      </div>
      <div class="field" id="customAppWrap" style="display:none">
        <div class="label">新しいアプリ名</div>
        <input id="customAppName" placeholder="アプリ名を入力">
      </div>
    </div>

    <div class="field">
      <div class="label">内容 / 案件名</div>
      <input id="title" placeholder="例：写真選択の端が押せない">
    </div>

    <div class="grid">
      <div class="field">
        <div class="label">種類</div>
        <select id="type">
          <option>アップデート案</option>
          <option>新規アプリ案</option>
          <option>不具合修正</option>
          <option>改善案</option>
          <option>その他</option>
        </select>
      </div>
      <div class="field">
        <div class="label">状態</div>
        <select id="status">
          <option>まだ</option>
          <option>途中</option>
          <option>確認中</option>
          <option>終わった</option>
          <option>保留</option>
        </select>
      </div>
    </div>

    <div class="field">
      <div class="label">メモ</div>
      <textarea id="memo" placeholder="必要なことだけ簡単に"></textarea>
    </div>

    <button class="add" onclick="addItem()">追加</button>
  </div>

  <div class="panel">
    <div class="filters">
      <div>
        <div class="label">状態で絞る</div>
        <select id="filterStatus" onchange="render()">
          <option value="">すべて</option>
          <option>まだ</option>
          <option>途中</option>
          <option>確認中</option>
          <option>終わった</option>
          <option>保留</option>
        </select>
      </div>
      <div>
        <div class="label">種類で絞る</div>
        <select id="filterType" onchange="render()">
          <option value="">すべて</option>
          <option>新規アプリ案</option>
          <option>アップデート案</option>
          <option>不具合修正</option>
          <option>改善案</option>
          <option>その他</option>
        </select>
      </div>
      <div>
        <div class="label">アプリで絞る</div>
        <select id="filterApp" onchange="render()">
          <option value="">すべて</option>
          <option>MIRU</option>
          <option>WAKERU</option>
          <option>KAKOMON</option>
          <option>ひらめきメモ</option>
          <option>知識メモ</option>
          <option>年間予定</option>
          <option>将棋反省</option>
        </select>
      </div>
    </div>
  </div>

  <div id="count" class="count"></div>
  <div id="list"></div>
</div>

<script>
const KEY = "appIdeaBoard_v1";
let items = JSON.parse(localStorage.getItem(KEY) || "[]");
const APP_KEY = "appIdeaBoard_customApps_v1";
let customApps = JSON.parse(localStorage.getItem(APP_KEY) || "[]");

function save(){
  localStorage.setItem(KEY, JSON.stringify(items));
}

function saveCustomApps(){
  localStorage.setItem(APP_KEY, JSON.stringify(customApps));
}

function refreshAppSelects(){
  const appSelect = document.getElementById("appName");
  const filterApp = document.getElementById("filterApp");

  const baseApps = ["MIRU","WAKERU","KAKOMON","ひらめきメモ","知識メモ","年間予定","将棋反省"];

  appSelect.innerHTML =
    baseApps.map(a => `<option>${esc(a)}</option>`).join("") +
    customApps.map(a => `<option>${esc(a)}</option>`).join("") +
    `<option value="__custom__">新規入力</option>`;

  filterApp.innerHTML =
    `<option value="">すべて</option>` +
    baseApps.map(a => `<option>${esc(a)}</option>`).join("") +
    customApps.map(a => `<option>${esc(a)}</option>`).join("");
}

function toggleCustomAppName(){
  const isCustom = document.getElementById("appName").value === "__custom__";
  document.getElementById("customAppWrap").style.display = isCustom ? "block" : "none";
}

function addItem(){
  const title = document.getElementById("title").value.trim();
  const memo = document.getElementById("memo").value.trim();
  const type = document.getElementById("type").value;
  const status = document.getElementById("status").value;

  let appName = document.getElementById("appName").value;
  const isCustomApp = appName === "__custom__";
  if(isCustomApp){
    appName = document.getElementById("customAppName").value.trim();
  }

  if(!appName){
    alert("アプリ名を入れてください");
    return;
  }

  if(isCustomApp && !customApps.includes(appName)){
    customApps.push(appName);
    saveCustomApps();
    refreshAppSelects();
  }
  if(!title){
    alert("内容 / 案件名を入れてください");
    return;
  }

  items.unshift({
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random(),
    appName, title, memo, type, status,
    createdAt: new Date().toLocaleString("ja-JP")
  });

  save();
  document.getElementById("title").value = "";
  document.getElementById("memo").value = "";
  document.getElementById("customAppName").value = "";
  document.getElementById("status").value = "まだ";
  document.getElementById("customAppWrap").style.display = "none";
  const appSelect = document.getElementById("appName");
  if([...appSelect.options].some(o => o.value === appName || o.text === appName)){
    appSelect.value = appName;
  }
  render();
}

function updateStatus(id, value){
  const item = items.find(x => x.id === id);
  if(item){
    item.status = value;
    save();
    render();
  }
}

function removeItem(id){
  if(!confirm("この項目を削除しますか？")) return;
  items = items.filter(x => x.id !== id);
  save();
  render();
}

function esc(s){
  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function render(){
  const fs = document.getElementById("filterStatus").value;
  const ft = document.getElementById("filterType").value;
  const fa = document.getElementById("filterApp").value;

  const visible = items.filter(x =>
    (!fs || x.status === fs) &&
    (!ft || x.type === ft) &&
    (!fa || x.appName === fa)
  );

  document.getElementById("count").textContent =
    `表示 ${visible.length}件 / 全 ${items.length}件`;

  const list = document.getElementById("list");

  if(!visible.length){
    list.innerHTML = `<div class="empty">まだ項目がありません</div>`;
    return;
  }

  list.innerHTML = visible.map(item => `
    <div class="card">
      <div class="top">
        <div>
          <div style="font-size:12px;color:#777;margin-bottom:4px;">${esc(item.appName || "未設定")}</div>
          <div class="title">${esc(item.title)}</div>
          <span class="type">${esc(item.type)}</span>
        </div>
      </div>

      ${item.memo ? `<div class="memo">${esc(item.memo)}</div>` : ""}

      <div class="row">
        <select class="status" onchange="updateStatus('${item.id}', this.value)">
          ${["まだ","途中","確認中","終わった","保留"].map(s =>
            `<option ${item.status===s ? "selected" : ""}>${s}</option>`
          ).join("")}
        </select>
        <button class="del" onclick="removeItem('${item.id}')">削除</button>
      </div>

      <div class="date">${esc(item.createdAt)}</div>
    </div>
  `).join("");
}

document.getElementById("customAppName").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    e.preventDefault();
    document.getElementById("title").focus();
  }
});

refreshAppSelects();
render();
</script>
</body>
</html>
